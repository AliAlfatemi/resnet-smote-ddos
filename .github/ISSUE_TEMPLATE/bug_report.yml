name: Bug report
description: Report a reproducible software problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a small synthetic example and remove private data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, operating system, and commit
